<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#030610" />
  <title>星尘圣诞树 · Gesture Experience</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="grain"></div>
  <header class="topbar"><div class="brand"><span class="dot"></span> STAR DUST <span class="muted">/ CHRISTMAS EXPERIENCE</span></div><div id="status" class="status">鼠标 / 触摸模式</div></header>
  <main class="ui">
    <div class="eyebrow">A HOLIDAY MOMENT</div>
    <h1>Make a wish<span>.</span></h1>
    <p class="subtitle">用你的手，唤醒星尘</p>
    <div class="actions">
      <button id="cameraBtn" class="primary">开启手势控制 <span>↗</span></button>
      <button id="burstBtn" class="secondary">粒子绽放</button>
    </div>
    <div class="hint" id="hint">拖动屏幕旋转 · 点击释放星尘</div>
  </main>
  <footer><span>✦</span> MERRY CHRISTMAS <span class="year">2026</span><span class="footer-right">THREE.JS · MEDIAPIPE</span></footer>
  <video id="camera" playsinline muted></video>
  <div class="camera-preview" id="previewWrap"><video id="preview" playsinline muted></video><span>HAND TRACKING</span></div>
  <script type="module" src="app.js"></script>
</body>
</html>
